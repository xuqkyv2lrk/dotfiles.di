# Same timings as v4: lock at 5 min, screen off at 10 min, suspend at 30 min.
# v5 ships with every idle behavior disabled, so nothing locks or sleeps without these.
[idle]
behavior_order = ["lock", "screen-off", "suspend"]
pre_action_fade_seconds = 5.0

[idle.behavior.lock]
action = "lock"
timeout = 300
enabled = true

[idle.behavior.screen-off]
action = "screen_off"
timeout = 600
enabled = true

# suspend locks first unless lock_before_suspend is false
[idle.behavior.suspend]
action = "suspend"
timeout = 1800
enabled = true
