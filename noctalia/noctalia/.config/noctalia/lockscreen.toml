# v4 values: blur 0.8, tint 0.35, lock before suspend.
# No lock transition: every effect delayed locking and unlocking on the 7680x2160 output,
# and without one the screen goes straight from the idle dim to the lock screen.
[lockscreen]
lock_before_suspend = true
blur_intensity = 0.8
tint_intensity = 0.35
transition = ["zoom"]
transition_duration = 500
