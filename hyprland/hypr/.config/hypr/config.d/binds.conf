$mainMod = SUPER

$menu = noctalia msg panel-toggle launcher

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more

# General
bind = $mainMod, RETURN, exec, foot
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, nautilus
bind = $mainMod SHIFT, N, exec, noctalia msg panel-toggle control-center notifications
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod, F, fullscreen, 1
bind = $mainMod, V, exec, hyprctl --batch "dispatch togglefloating; dispatch centerwindow 1"
bind = $mainMod, D, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, O, exec, firefox
bind = $mainMod, L, exec, noctalia msg session lock
bind = $mainMod, P, exec, noctalia msg panel-toggle session

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move active window
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Audio
binde = ,XF86AudioRaiseVolume, exec, noctalia msg volume-up 5
binde = ,XF86AudioLowerVolume, exec, noctalia msg volume-down 5
binde = ,XF86AudioMute, exec, noctalia msg volume-mute
binde = ,XF86AudioMicMute, exec, noctalia msg mic-mute
bind = ,XF86AudioPlay, exec, noctalia msg media toggle
bind = ,XF86AudioPrev, exec, noctalia msg media previous
bind = ,XF86AudioNext, exec, noctalia msg media next

# Brightness
binde = ,XF86MonBrightnessUp, exec, noctalia msg brightness-up
binde = ,XF86MonBrightnessDown, exec, noctalia msg brightness-down

# Noctalia shell
bind = $mainMod SHIFT, S, exec, noctalia msg settings-toggle
bind = $mainMod SHIFT, C, exec, noctalia msg panel-toggle control-center
bind = $mainMod SHIFT, T, exec, noctalia msg bar-toggle
bind = $mainMod CTRL, V, exec, noctalia msg panel-toggle clipboard
bind = $mainMod SHIFT, I, exec, noctalia msg caffeine-toggle

# Screenshots (Noctalia; the active-window shot stays on grim + swappy)
bind = ,Print, exec, noctalia msg screenshot-region
bind = SHIFT, Print, exec, noctalia msg screenshot-annotate
bind = CTRL ALT, Print, exec, grim -g "$(hyprctl activewindow -j | jq -r '"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"')" - | swappy -f -
bind = CTRL, Print, exec, record-region

# ROG Zephyrus G14 (2022) GA402 Binds
bind = ,156, exec, rog-control-center
bind = ,211, exec, asusctl profile -n
bind = ,237, exec, asusctl -p
bind = ,238, exec, asusctl -n
bind = ,210, exec, asusctl aura -n
