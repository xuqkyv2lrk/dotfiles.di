# Media player keys go through Noctalia. The seek keys stay on playerctl, since Noctalia has no
# seek command.
#
# Requires:     playerctl (seek keys only)

# Allow Play and Stop bindings even if the screen is locked
bindsym --locked {
    XF86AudioPlay       exec noctalia msg media toggle
    XF86AudioStop       exec noctalia msg media stop
}

bindsym {
    XF86AudioForward    exec playerctl position +10
    XF86AudioNext       exec noctalia msg media next
    XF86AudioPause      exec noctalia msg media pause
    XF86AudioPrev       exec noctalia msg media previous
    XF86AudioRewind     exec playerctl position -10
}
