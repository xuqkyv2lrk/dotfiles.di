# Volume controls go through Noctalia, which also shows its own volume popup.
# Allow them even if the screen is locked.
bindsym --locked {
    XF86AudioRaiseVolume exec noctalia msg volume-up 5
    XF86AudioLowerVolume exec noctalia msg volume-down 5
    XF86AudioMute exec noctalia msg volume-mute
    XF86AudioMicMute exec noctalia msg mic-mute
}
