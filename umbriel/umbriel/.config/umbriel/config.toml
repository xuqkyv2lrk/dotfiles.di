# Umbriel configuration, ported from the niri setup.
# Check edits with `umbriel config validate`. Reference: https://docs.noctalia.dev/umbriel/

[include]
files = ["effects/gradient/effect.toml"]

[general]
autostart = ["noctalia"]
mod_key = "Super"
show_cheatsheet = false

[events]
lid_close = "umbriel msg output-disable:eDP-2"
lid_open = "umbriel msg output-enable:eDP-2"

# ==============================================================================
# Outputs

[output.eDP-2]
scale = 2.0
layout.scrolling.default_extent_fraction = 0.5

[output.DP-1]
mode = "7680x2160@60"
scale = 1.5
layout.scrolling.default_extent_fraction = 0.333

[output.DP-3]
mode = "7680x2160@120"
scale = 1.5
# HDR only for fullscreen content with HDR metadata, so the SDR desktop is untouched
hdr = "auto"
layout.scrolling.default_extent_fraction = 0.333

# ==============================================================================
# Appearance (Catppuccin Mocha)

[appearance]
border_width = 2
corner_radius = 10
prefer_no_csd = true

[appearance.blur]
radius = 3

[appearance.shadow]
enabled = true
softness = 30
offset_x = 0
offset_y = 5

[colors]
shadow = "#1a1a1aee"

[colors.border]
focused = "#cba6f7ff"
unfocused = "#585b70ff"

# ==============================================================================
# Input

[input.keyboard]
layout = "us"
repeat_delay = 600
repeat_rate = 25
numlock_toggle = true

[input.cursor]
theme = "catppuccin-mocha-mauve-cursors"
size = 24

# ==============================================================================
# Layout

[layout]
gap = 4
extent_presets = [0.333, 0.5, 0.667, 1.0]

[layout.struts]
left = 2
right = 2
top = 2
bottom = 2

# Outputs without their own value; the ultrawides above use a third instead
[layout.scrolling]
default_extent_fraction = 0.5
center_focused = "never"
# open from the left edge like niri, not centered while the strip is narrower than the output
center_underfull_strip = false

[effects]
border = "gradient"

# ==============================================================================
# Keybinds
# Defining this table replaces the built-in bind set.

[keybinds]

# Applications and session
"Mod+Return" = { action = "spawn:foot", repeat = false }
"Mod+E" = { action = "spawn:nautilus", repeat = false }
"Mod+O" = { action = "spawn:firefox", repeat = false }
"Mod+D" = "spawn:noctalia msg panel-toggle launcher"
"Mod+L" = { action = "spawn:noctalia msg session lock", repeat = false }
"Mod+P" = "spawn:noctalia msg panel-toggle session"
"Mod+Ctrl+W" = "spawn:noctalia msg panel-toggle wallpaper"
"Mod+Shift+N" = "spawn:noctalia msg panel-toggle control-center notifications"
"Mod+Shift+M" = "spawn:noctalia msg media toggle"
"Mod+Comma" = "spawn:noctalia msg settings-toggle"
"Mod+Shift+S" = "spawn:noctalia msg screenshot-region"
"Mod+Shift+C" = "spawn:noctalia msg panel-toggle control-center"
"Mod+Shift+T" = "spawn:noctalia msg bar-toggle"
"Mod+Ctrl+V" = "spawn:noctalia msg panel-toggle clipboard"
"Mod+Shift+I" = "spawn:noctalia msg caffeine-toggle"
"Mod+M" = "session-quit"
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+Shift+Slash" = "cheatsheet-toggle"
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }

# Screenshots and recording
"Print" = "spawn:noctalia msg screenshot-region"
"Shift+Print" = "spawn:noctalia msg screenshot-annotate"
"Ctrl+Print" = "spawn:record-region"

# Media, volume and brightness, routed through noctalia for its OSDs
"XF86AudioRaiseVolume" = { action = "spawn:noctalia msg volume-up 5", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn:noctalia msg volume-down 5", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn:noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioMicMute" = { action = "spawn:noctalia msg mic-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn:noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn:noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn:noctalia msg media previous", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn:noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn:noctalia msg brightness-down", allow_when_locked = true }

# ASUS ROG keys
"XF86Launch1" = { action = "spawn:rog-control-center", repeat = false }
"XF86Launch4" = { action = "spawn:asusctl profile next", repeat = false }
"XF86Launch3" = { action = "spawn:asusctl aura effect --next-mode", repeat = false }
"XF86KbdBrightnessUp" = "spawn:asusctl leds next"
"XF86KbdBrightnessDown" = "spawn:asusctl leds prev"

# Window state and widths
"Mod+W" = { action = "column-toggle-tabbed", repeat = false }
"Mod+Shift+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+V" = { action = "window-toggle-floating", repeat = false }
"Mod+R" = "window-cycle-primary-extent"
"Mod+Ctrl+R" = "window-set-primary-extent:1.0"
"Mod+Alt+1" = "window-set-primary-extent:0.333"
"Mod+Alt+2" = "window-set-primary-extent:0.5"
"Mod+Alt+3" = "window-set-primary-extent:0.667"
"Mod+Alt+4" = "window-set-primary-extent:1.0"

# Focus and movement
"Mod+Left" = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+Up" = "window-focus-up"
"Mod+Down" = "window-focus-down"
"Mod+Shift+Left" = "window-move-or-output-left"
"Mod+Shift+Right" = "window-move-or-output-right"
"Mod+Alt+Left" = "column-move-left"
"Mod+Alt+Right" = "column-move-right"
"Mod+Shift+Up" = "column-move-to-workspace-previous"
"Mod+Shift+Down" = "column-move-to-workspace-next"
"Mod+Ctrl+Left" = "window-consume-or-expel-left"
"Mod+Ctrl+Right" = "window-consume-or-expel-right"
"Mod+Ctrl+Up" = "window-move-up"
"Mod+Ctrl+Down" = "window-move-down"

# Workspaces and overview
"Mod+Page_Up" = "workspace-previous"
"Mod+Page_Down" = "workspace-next"
"Mod+0" = { action = "overview-toggle", repeat = false }
"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+Shift+1" = "column-move-to-workspace:1"
"Mod+Shift+2" = "column-move-to-workspace:2"
"Mod+Shift+3" = "column-move-to-workspace:3"
"Mod+Shift+4" = "column-move-to-workspace:4"
"Mod+Shift+5" = "column-move-to-workspace:5"
"Mod+Shift+6" = "column-move-to-workspace:6"
"Mod+Shift+7" = "column-move-to-workspace:7"
"Mod+Shift+8" = "column-move-to-workspace:8"
"Mod+Shift+9" = "column-move-to-workspace:9"
"Mod+Ctrl+1" = "window-move-to-workspace:1"
"Mod+Ctrl+2" = "window-move-to-workspace:2"
"Mod+Ctrl+3" = "window-move-to-workspace:3"
"Mod+Ctrl+4" = "window-move-to-workspace:4"
"Mod+Ctrl+5" = "window-move-to-workspace:5"
"Mod+Ctrl+6" = "window-move-to-workspace:6"
"Mod+Ctrl+7" = "window-move-to-workspace:7"
"Mod+Ctrl+8" = "window-move-to-workspace:8"
"Mod+Ctrl+9" = "window-move-to-workspace:9"

# Layouts and scratchpad (umbriel only; these keys are unbound in niri)
"Mod+Alt+T" = "workspace-set-layout:toggle:scrolling,dwindle"
"Mod+Shift+Space" = { action = "window-move-to-scratchpad", repeat = false }
"Mod+Space" = "scratchpad-toggle"
"Mod+Ctrl+Space" = { action = "window-restore-from-scratchpad", repeat = false }
"Mod+Tab" = "scratchpad-focus-next"

# ==============================================================================
# Window rules

[[window_rule]]
match.app_id = "^org\\.gnome\\.Nautilus$"
default_floating = true

[[window_rule]]
match.app_id = "^monitor$"
default_floating = true

[[window_rule]]
match.app_id = "^com\\.saivert\\.pwvucontrol$"
default_floating = true
opacity = 0.95

[[window_rule]]
match.app_id = ["^bluetui$", "^lxqt-policykit-agent$", "^org\\.opengamingcollective\\.rog-control-center$"]
default_floating = true

[[window_rule]]
match.app_id = "^dev\\.noctalia\\.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev\\.noctalia\\.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.app_id = "^Plexamp$"
default_floating = true
default_floating_size_px = { width = 275, height = 655 }

[[window_rule]]
match.app_id = "^gamescope$"
default_scrolling_extent = 0.667

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

# ==============================================================================
# Layer rules

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true
blur_optimized = false

[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"
