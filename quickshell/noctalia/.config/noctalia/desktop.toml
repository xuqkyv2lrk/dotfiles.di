# Spectrum hangs from the bottom edge of the bar, centered on the clock and player.
# One audio_visualizer is capped at 128 bands, so two halves give 256 bars across the same width.
# The halves overlap by about 72 px: the lowest bands are quiet and left a gap in the middle.
# Desktop widgets render on the Bottom layer, so windows can cover it.
[desktop_widgets]
enabled = true
schema_version = 2
widget_order = ["audio-left", "audio-right"]

[desktop_widgets.widget.audio-left]
type = "audio_visualizer"
output = "DP-3"
cx = 2431.0
cy = 50.0
box_width = 330.0
box_height = 32.0
flip_x = true
flip_y = true

[desktop_widgets.widget.audio-left.settings]
bands = 128
background = false
background_padding = 0.0
mirrored = false
centered = false
show_when_idle = false
color_1 = "primary"
color_2 = "secondary"

[desktop_widgets.widget.audio-right]
type = "audio_visualizer"
output = "DP-3"
cx = 2689.0
cy = 50.0
box_width = 330.0
box_height = 32.0
flip_y = true

[desktop_widgets.widget.audio-right.settings]
bands = 128
background = false
background_padding = 0.0
mirrored = false
centered = false
show_when_idle = false
color_1 = "primary"
color_2 = "secondary"
